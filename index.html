<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | Browser extensions manager UI</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <header>
    <img src="./assets/images/logo.svg" alt="logo">
    <button class="theme-btn">
    <img class="theme-icon" src="./assets/images/icon-sun.svg" alt="Toggle theme">
</button>
</button>
  </header>

  <main>
    <section>
      <div class="section-header">
        <h1>Extensions List</h1>

        <div class="filters">
          <button class="active">All</button>
          <button>Active</button>
          <button>Inactive</button>
        </div>
      </div>
      
      <div class="cards"></div>
    </section>
  </main>


  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Shrushti Shirbhate</a>.
  </footer>

  <script src="./script.js"></script>
  
</body>
</html>
